[workspace]
members = ["yew-tincture-test"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.100"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
yew = "0.23.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

[package]
name = "yew-tincture"
description = "components for yew web framework"
repository = "https://github.com/astraw/yew-tincture"
version = "0.4.1"
authors = ["Andrew Straw <strawman@astraw.com>"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme = "README.md"
keywords = ["yew", "components", "wasm", "web"]
categories = ["web-programming", "wasm", "gui"]

[dependencies]
yew.workspace = true
uuid = { version = "1.29", features = ["v4", "js"] }
web-sys = { version = "0.3.106", features = ["HtmlInputElement"] }

[lints]
workspace = true
