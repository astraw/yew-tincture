[package]
name = "yew-tincture-test"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
yew = { workspace = true, features = ["csr"] }
web-sys = { version = "0.3.107", features = [
    "Element",
    "HtmlInputElement",
    "Window",
] }
wasm-bindgen = "0.2.130"
wasm-logger = "0.2.0"
log = "0.4.35"
gloo-timers = "0.4.0"

yew-tincture = { path = ".." }

[lints]
workspace = true
